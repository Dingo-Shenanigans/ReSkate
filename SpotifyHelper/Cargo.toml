[package]
name = "reskate-spotify"
version = "0.1.0"
edition = "2021"
description = "ReSkate's Spotify Connect device, linked into ReSkate.dll: receives what Spotify plays and hands it to the game"
license = "MIT"

[lib]
name = "reskate_spotify"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
# Secure connections are made by code of their own (rustls, with the certificate authorities
# built in), not by Windows': under Wine and Proton, Windows' is Wine's own and the device signed
# in but was never taken up by Spotify as one to play on (seen 2026-10-14). It is the same code
# on Windows and there.
librespot-core = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-connect = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-discovery = { version = "0.8.0", default-features = false, features = ["with-libmdns", "rustls-tls-webpki-roots"] }
librespot-metadata = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures-util = "0.3"
log = "0.4"
sha1 = "0.10"
hex = "0.4"
# (For sound that is not Spotify's: a program's output, decoded. The version librespot uses.)
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "isomp4", "mp3", "ogg", "vorbis", "flac", "wav", "pcm"] }
# (For an internet radio station: what is at an address, as it comes. The one already in the tree.)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }

[profile.release]
opt-level = 2
strip = true
